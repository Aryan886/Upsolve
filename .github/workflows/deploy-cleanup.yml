name: Reconcile deployment SSH access

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  id-token: write

jobs:
  reconcile:
    if: github.repository == 'Aryan886/Upsolve' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    concurrency:
      group: cp-notes-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.CLEANUP_ROLE_ARN }}
          role-session-name: cp-notes-cleanup-${{ github.run_id }}
      - name: Reconcile completed runs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LIGHTSAIL_INSTANCE: ${{ vars.LIGHTSAIL_INSTANCE }}
        run: python3 deploy/reconcile-firewall.py
